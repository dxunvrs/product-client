plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.dxunvrs'
version = '1.0'

javafx {
    version = '21.0.5'
    modules = ['javafx.controls', 'javafx.graphics']
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.dxunvrs.ru/releases"
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:latest.release'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv:latest.release'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:latest.release'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'ch.qos.logback:logback-classic:latest.release'

    implementation 'org.jline:jline:3.30.0'

    implementation 'com.dxunvrs:common:latest.release'

}

jar {
    manifest {
        attributes["Main-Class"] = "Main"
    }
}